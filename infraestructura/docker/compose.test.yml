services:
  test-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tutoria}
      DB_USER: ${DB_USER:-tutoria}
      DB_PASSWORD: ${DB_PASSWORD:?Configura .env}
      RUN_DB_TESTS: "1"
    depends_on:
      backend:
        condition: service_healthy
