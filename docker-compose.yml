name: tutoria-lucero

x-backend: &backend
  image: tutoria-backend:local
  build: ./backend
  environment:
    APP_ENV: ${APP_ENV:-development}
    AUTH_MODE: ${AUTH_MODE:-mock}
    LLM_FREE_TIER_CONFIRMED: ${LLM_FREE_TIER_CONFIRMED:-false}
    LLM_DAILY_REQUEST_LIMIT: ${LLM_DAILY_REQUEST_LIMIT:-5}
    LLM_ENABLED: ${LLM_ENABLED:-false}
    LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-gemini}
    LLM_MODEL: ${LLM_MODEL:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-12000}
    LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
    LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-5}
    DOCUMENT_STORAGE_PATH: /app/uploads/documents
    DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-10485760}
    DOCUMENT_CHUNK_CHARS: ${DOCUMENT_CHUNK_CHARS:-1000}
    DOCUMENT_CHUNK_OVERLAP: ${DOCUMENT_CHUNK_OVERLAP:-150}
    EXTRACTION_TIMEOUT_SECONDS: ${EXTRACTION_TIMEOUT_SECONDS:-15}
    EMBEDDING_MODEL_PATH: /app/models/e5-small
    EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-180}
    AUTH_MOCK_USER: ${AUTH_MOCK_USER:-student}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
    AUTH_CALLBACK_URL: ${AUTH_CALLBACK_URL:-http://localhost:4200/api/v1/auth/callback}
    AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:4200/inicio}
    AUTH_LOGIN_URL: ${AUTH_LOGIN_URL:-http://localhost:4200/login}
    AUTH_ALLOWED_DOMAINS: ${AUTH_ALLOWED_DOMAINS:-est.ups.edu.ec}
    CAS_LOGIN_URL: ${CAS_LOGIN_URL:-}
    CAS_VALIDATE_URL: ${CAS_VALIDATE_URL:-}
    CAS_SERVICE_PARAMETER: ${CAS_SERVICE_PARAMETER:-service}
    CAS_TICKET_PARAMETER: ${CAS_TICKET_PARAMETER:-ticket}
    CAS_EMAIL_ATTRIBUTE: ${CAS_EMAIL_ATTRIBUTE:-email}
    CAS_ID_ATTRIBUTE: ${CAS_ID_ATTRIBUTE:-uid}
    CAS_FIRST_NAME_ATTRIBUTE: ${CAS_FIRST_NAME_ATTRIBUTE:-givenName}
    CAS_LAST_NAME_ATTRIBUTE: ${CAS_LAST_NAME_ATTRIBUTE:-sn}
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: ${DB_NAME:-tutoria}
    DB_USER: ${DB_USER:-tutoria}
    DB_PASSWORD: ${DB_PASSWORD:?Ejecuta infraestructura/scripts/initialize-local.ps1}

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-tutoria}
      POSTGRES_USER: ${DB_USER:-tutoria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    volumes:
      - document_data:/app/uploads/documents
      - embedding_data:/app/models/e5-small:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3

  prepare-embeddings:
    <<: *backend
    profiles: ["embeddings"]
    command: ["python", "-m", "app.modulos.rag.servicios.prepare_model"]
    volumes:
      - embedding_data:/app/models/e5-small

volumes:
  postgres_data:
  document_data:
  embedding_data:
